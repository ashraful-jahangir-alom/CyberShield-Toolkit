{% extends 'base.html' %}{% block content %}<h1>Hash Generator</h1><div class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><textarea class="form-control mb-3" name="text" rows="5" placeholder="Enter text to hash" required></textarea><button class="btn btn-info">Generate Hashes</button></form>{% if result %}<hr>{% for name,value in result.items() %}<label class="form-label text-uppercase">{{name}}</label><div class="input-group mb-3"><input class="form-control font-monospace" id="{{name}}" readonly value="{{value}}"><button class="btn btn-outline-info" onclick="copyText('{{name}}')">Copy</button></div>{% endfor %}{% endif %}</div>{% endblock %}
