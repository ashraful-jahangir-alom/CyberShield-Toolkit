{% extends 'base.html' %}{% block content %}<h1>File Encryption</h1><div class="panel"><p class="notice">AES-256-GCM encryption. Files are processed in memory and are never retained by CyberShield.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="mb-3"><label class="form-label">File</label><input class="form-control" type="file" name="file" required></div><div class="mb-3"><label class="form-label">AES-256 Key</label><div class="input-group"><input class="form-control font-monospace" id="encryptionKey" name="key" value="{{generated_key or ''}}" placeholder="Generate a key or paste an existing key" required autocomplete="off"><button class="btn btn-outline-info" type="button" onclick="generateEncryptionKey()">Generate AES-256 Key</button><button class="btn btn-outline-light" type="button" onclick="copyText('encryptionKey')">Copy</button></div><div class="form-text text-secondary">Store this key safely. A lost key cannot decrypt the file.</div></div><button class="btn btn-info me-2" name="action" value="encrypt"><i class="fa-solid fa-lock"></i> Encrypt & Download</button><button class="btn btn-outline-info" name="action" value="decrypt"><i class="fa-solid fa-lock-open"></i> Decrypt & Download</button></form></div>{% endblock %}
