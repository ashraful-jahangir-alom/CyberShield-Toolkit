{% extends 'base.html' %}{% block content %}<h1>PDF Reports</h1><div class="panel"><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-md-8"><input class="form-control" name="target" placeholder="Report target / project name" required></div><div class="col-md-4"><button class="btn btn-info w-100">Generate PDF Report</button></div></form></div><div class="panel mt-3 table-responsive"><table class="table"><tr><th>Target</th><th>Score</th><th>Generated</th><th></th></tr>{% for r in reports %}<tr><td>{{r.target}}</td><td>{{r.score}}/100</td><td>{{r.created_at.strftime('%d %b %Y %H:%M')}}</td><td><a class="btn btn-sm btn-outline-info" href="{{url_for('download_report',report_id=r.id)}}">Download</a></td></tr>{% else %}<tr><td colspan="4">No reports generated.</td></tr>{% endfor %}</table></div>{% endblock %}
