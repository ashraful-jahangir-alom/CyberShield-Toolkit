{% extends 'base.html' %}{% block content %}<h1>Network Discovery</h1>{% include '_scan_form.html' %}{% if result is not none %}<div class="panel mt-4 table-responsive"><table class="table"><tr><th>IP</th><th>MAC</th><th>Hostname</th><th>Vendor</th><th>OS</th></tr>{% for d in result %}<tr><td>{{d.ip}}</td><td>{{d.mac}}</td><td>{{d.hostname}}</td><td>{{d.vendor}}</td><td>{{d.os}}</td></tr>{% else %}<tr><td colspan="5">No devices responded.</td></tr>{% endfor %}</table></div>{% endif %}{% endblock %}
