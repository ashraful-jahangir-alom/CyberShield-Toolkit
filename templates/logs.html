{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center"><h1>Scan Logs</h1><a class="btn btn-outline-info" href="{{url_for('export_logs')}}">Export CSV</a></div><form class="input-group mb-3"><input class="form-control" name="q" value="{{request.args.get('q','')}}" placeholder="Search target or module"><button class="btn btn-info">Search</button></form><div class="panel table-responsive"><table class="table"><tr><th>Date</th><th>Target</th><th>Module</th><th>Risk</th><th>Duration</th></tr>{% for s in scans %}<tr><td>{{s.created_at.strftime('%Y-%m-%d %H:%M')}}</td><td>{{s.target}}</td><td>{{s.module}}</td><td>{{s.risk}}</td><td>{{s.duration}}s</td></tr>{% else %}<tr><td colspan="5">No logs yet.</td></tr>{% endfor %}</table></div>{% endblock %}
